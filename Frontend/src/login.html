<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
</head>

<body>
    <!-- Navbar -->
    <div class="container">
        <header
            class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
            <div class="col-md-3 mb-2 mb-md-0">
                <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
                    <svg class="bi" width="40" height="32" role="img" aria-label="Bootstrap">
                        <use xlink:href="#bootstrap"></use>
                    </svg>
                </a>
            </div>
            <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
                <li><a href="index.html" class="nav-link px-2">Home</a>
                </li>
                <li><a href="#" class="nav-link px-2">Features</a>
                </li>
                <li><a href="#" class="nav-link px-2">Pricing</a>
                </li>
                <li><a href="#" class="nav-link px-2">FAQs</a></li>
                <li><a href="#" class="nav-link px-2">About</a>
                </li>
            </ul>
            <div class="col-md-3 text-end" id="authButtons">
                <a href="login.html" class="btn btn-outline-primary me-2">Login</a>
                <a href="cadastro.html" class="btn btn-primary">Cadastre-se</a>
            </div>

        </header>
    </div>

    <!-- Formulário de Login -->
    <div class="container d-flex justify-content-center align-items-center" style="height: 90vh;">
        <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
            <h4 class="mb-4 text-center">Entrar no Sistema</h4>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="cpfInput" class="form-label">CPF</label>
                    <input type="text" class="form-control" id="cpfInput" placeholder="Digite seu CPF (Apenas números)"
                        maxlength="11" pattern="\d{11}" title="Digite um CPF válido" required>
                </div>
                <div class="mb-3">
                    <label for="passwordInput" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="Digite sua senha"
                        required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
        </div>
    </div>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/serviceJS/login.js"></script>
</body>

</html>
